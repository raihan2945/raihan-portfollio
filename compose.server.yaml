# Server deployment: pulls the image that CI publishes to GitHub Container
# Registry (the repo's "Packages" section). No repo checkout or build needed.
# Copy only this file to the server, then:
#
#   docker compose -f compose.server.yaml up -d     # deploy, or update to the newest image
#   docker compose -f compose.server.yaml logs -f   # follow logs
#   docker compose -f compose.server.yaml down      # stop
#
# Optional overrides (shell env or a .env file next to this one):
#   TAG   image tag to run: latest (default), sha-<short commit>, or a version like 1.2.0
#   PORT  host port to publish (default: 4054)

name: raihan-portfollio

services:
  web:
    image: ghcr.io/raihan2945/raihan-portfollio:${TAG:-latest}
    pull_policy: always # `up` always checks for a newer image
    container_name: raihan-portfollio
    ports:
      - "${PORT:-4054}:4054"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    init: true # forward signals so `down` stops the server cleanly
    restart: unless-stopped
    # healthcheck is defined in the Dockerfile
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
